# Frogbot: two jobs – repo scan (fix PRs) and PR scan (comment on PRs).
# Scope: Javascript only (see .frogbot/frogbot-config.yml).
# Auth: OIDC (same provider as other workflows).

name: "Frogbot Security Scan"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'Javascript/**'
      - '.frogbot/**'
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    strategy:
      matrix:
        branch: ["main"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: jfrog/frogbot@v2
        with:
          oidc-provider-name: tpaz1/end2end-demos@github
        env:
          JF_CLI_LOG_LEVEL: "DEBUG"
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: end2end-demo
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}
          JF_DEPS_REPO: "npm-virtual"
          JF_FAIL: "FALSE"
          JF_PULL_REQUEST_TITLE_TEMPLATE: "[🐸 Frogbot-Automatic PR] Upgrade ${IMPACTED_PACKAGE} to ${FIX_VERSION}"
          JF_GIT_AGGREGATE_FIXES: "FALSE"

  scan-pull-request:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: jfrog/frogbot@v2
        with:
          oidc-provider-name: tpaz1/end2end-demos@github
        env:
          JF_CLI_LOG_LEVEL: "DEBUG"
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: end2end-demo
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_DEPS_REPO: "npm-virtual"
          JF_FAIL: "FALSE"
          JF_INCLUDE_ALL_VULNERABILITIES: "TRUE"
