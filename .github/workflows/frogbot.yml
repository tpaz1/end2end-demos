# Frogbot: security scans + auto fix PRs via JFrog Xray
# Scope: scans only the Javascript directory (see .frogbot/frogbot-config.yml)
# - PR scan: runs only when the PR changes files under Javascript/ or .frogbot/
# - Repo scan: runs on push to main, daily at 00:00 UTC, and on workflow_dispatch
# OIDC: same provider as other workflows (tpaz1/end2end-demos@github)
# Auto PRs: Frogbot creates PRs for fixable vulnerabilities when JF_GIT_TOKEN has write access
# No watch: all vulnerabilities and security issues are reported (JF_PROJECT is project context only).
# JF_GIT_TOKEN: use GITHUB_TOKEN so dependency-graph (SBOM) upload works; or use a PAT with repo scope.

name: "Frogbot Security Scan"

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'Javascript/**'
      - '.frogbot/**'
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  security-events: write
  id-token: write

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ["main"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - uses: jfrog/frogbot@v2
        with:
          oidc-provider-name: tpaz1/end2end-demos@github
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: end2end-demo
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}
